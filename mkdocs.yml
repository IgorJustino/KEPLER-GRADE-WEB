site_name: KEPLER — Grade Web
site_description: Documentação de produto, requisitos e desenvolvimento do planejador acadêmico KEPLER.
site_url: https://igorjustino.github.io/KEPLER-GRADE-WEB/
repo_url: https://github.com/IgorJustino/KEPLER-GRADE-WEB
repo_name: IgorJustino/KEPLER-GRADE-WEB
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: assets/kepler-mark.svg
  favicon: assets/kepler-mark.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Usar tema escuro

nav:
  - Início: index.md
  - Produto:
      - Visão do produto: produto/visao.md
      - Cenário e stakeholders: produto/cenario.md
      - Escopo e personas: produto/escopo.md
      - Base e descoberta: produto/base-descoberta.md
  - Engenharia de Requisitos:
      - Processo de requisitos: requisitos/processo.md
      - Requisitos funcionais: requisitos/funcionais.md
      - Requisitos não funcionais: requisitos/nao-funcionais.md
      - Especificação suplementar: requisitos/especificacao-suplementar.md
      - NFR Framework: requisitos/nfr-framework.md
      - Épicos: requisitos/epicos.md
      - Histórias de usuário: requisitos/historias-usuario.md
      - Backlog do produto: requisitos/backlog.md
      - Rastreabilidade: requisitos/rastreabilidade.md
  - Arquitetura e Modelagem:
      - Visão arquitetural: desenvolvimento/arquitetura.md
      - Modelagem estática: arquitetura/modelagem-estatica.md
      - Modelagem dinâmica: arquitetura/modelagem-dinamica.md
      - Modelagem de dados: arquitetura/modelagem-dados.md
      - Padrões e reutilização: arquitetura/padroes-reutilizacao.md
      - CI/CD e operação: arquitetura/ci-cd.md
  - Desenvolvimento:
      - Metodologia: desenvolvimento/metodologia.md
      - Qualidade e testes: desenvolvimento/qualidade.md
      - Roadmap: desenvolvimento/roadmap.md
  - Projeto:
      - Equipe: projeto/equipe.md
      - Como contribuir: projeto/contribuicao.md
      - Referências: projeto/referencias.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: pt

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/IgorJustino/KEPLER-GRADE-WEB
      name: KEPLER no GitHub
  generator: false

copyright: Documentação do projeto KEPLER — Grade Web
